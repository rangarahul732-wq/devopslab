<!DOCTYPE html>
<html>
<head>
    <title>Hello Button</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        h1 {
            color: darkblue;
        }

        button {
            background-color: blue;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #message {
            color: green;
            font-size: 25px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Webpage</h1>

    <button onclick="showHello()">Click Here</button>

    <p id="message"></p>

    <script>
        function showHello() {
            document.getElementById("message").innerHTML = "Hello! Welcome to My Page";
        }
    </script>

</body>
</html>
